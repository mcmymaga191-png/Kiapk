<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Кто оплатил</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#16181d;--muted:#6b7280;--line:#e3e7ef;--accent:#2563eb;--ok:#16a34a;--okbg:#e7f6ec;--danger:#dc2626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d24;--text:#eceef3;--muted:#9aa3b2;--line:#2a2f3a;--accent:#5b8cff;--ok:#4ade80;--okbg:#14301f;--danger:#f87171}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d24;--text:#eceef3;--muted:#9aa3b2;--line:#2a2f3a;--accent:#5b8cff;--ok:#4ade80;--okbg:#14301f;--danger:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.g{cursor:pointer}
.g b{font-size:18px}
.muted{color:var(--muted);font-size:14px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.add{display:flex;gap:8px;margin:14px 0}
input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit}
button{padding:12px 16px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:600}
button.sec{background:var(--card);color:var(--text);border:1px solid var(--line)}
button.del{background:transparent;color:var(--danger);border:1px solid var(--line)}
button.armed{background:var(--danger);color:#fff}
.back{background:none;color:var(--accent);padding:8px 0;font-weight:600}
.p{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.p.paid{background:var(--okbg);border-color:var(--ok)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;flex:none;color:#fff;font-size:16px}
.p.paid .chk{background:var(--ok);border-color:var(--ok)}
.p .n{flex:1;word-break:break-word}
.x{background:none;color:var(--muted);padding:4px 10px;font-size:20px}
.price{display:flex;align-items:center;gap:8px;margin:10px 0}
.price input{max-width:130px}
.mon{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px}.mon b{font-size:18px}.mon button{width:48px;padding:10px 0}
.row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
</style>
</head>
<body>
<main id="app"></main>
<script>
var KEY='who-paid-v1';
var MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function ym(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
var month=ym(new Date()),cur=null,armed=null,data=load();
function shift(m,k){var a=m.split('-'),d=new Date(+a[0],+a[1]-1+k,1);return ym(d)}
function mlabel(m){var a=m.split('-');return MN[+a[1]-1]+' '+a[0]}
function isPaid(p){return !!(p.months&&p.months[month])}
function monbar(){return '<div class="mon"><button class="sec" data-act="mprev">‹</button><b>'+mlabel(month)+'</b><button class="sec" data-act="mnext">›</button></div>'}
function load(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);d.groups.forEach(function(g){g.people.forEach(function(p){if(!p.months)p.months={};if('paid' in p){if(p.paid)p.months[month]=true;delete p.paid}})});return d}}catch(e){}return{groups:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return Number(n).toLocaleString('ru-RU')}
function grp(id){return data.groups.find(function(g){return g.id===id})}
function stat(g){var p=g.people.filter(isPaid).length;return{paid:p,total:g.people.length,pct:g.people.length?Math.round(p/g.people.length*100):0}}
function render(focusId){
  var h='';
  if(!cur){
    h+='<h1>Кто оплатил</h1>'+monbar();
    if(!data.groups.length)h+='<p class="muted">Групп пока нет. Создайте первую ниже.</p>';
    data.groups.forEach(function(g){var s=stat(g);
      h+='<div class="card g" data-act="open" data-id="'+g.id+'"><b>'+esc(g.name)+'</b><div class="muted">Оплатили '+s.paid+' из '+s.total+'</div><div class="bar"><i style="width:'+s.pct+'%"></i></div></div>'});
    h+='<div class="add"><input id="ng" placeholder="Название группы" maxlength="60"><button data-act="addg">Добавить</button></div>';
  }else{
    var g=grp(cur);if(!g){cur=null;return render()}
    var s=stat(g),sum=g.price?' · собрано '+money(s.paid*g.price)+' из '+money(s.total*g.price):'';
    h+='<button class="back" data-act="home">‹ Все группы</button><h1>'+esc(g.name)+'</h1>'+monbar();
    h+='<div class="muted">Оплатили '+s.paid+' из '+s.total+sum+'</div><div class="bar"><i style="width:'+s.pct+'%"></i></div>';
    h+='<div class="price"><span class="muted">Сумма с человека:</span><input id="pr" type="number" inputmode="decimal" min="0" placeholder="0" value="'+(g.price||'')+'"></div>';
    g.people.forEach(function(p){
      h+='<div class="p'+(isPaid(p)?' paid':'')+'" data-act="tog" data-id="'+p.id+'"><span class="chk">'+(isPaid(p)?'✓':'')+'</span><span class="n">'+esc(p.name)+'</span><button class="x" data-act="delp" data-id="'+p.id+'" aria-label="Удалить">×</button></div>'});
    h+='<div class="add"><input id="np" placeholder="Имя человека" maxlength="60"><button data-act="addp">Добавить</button></div>';
    h+='<div class="row"><button class="sec" data-act="reset">Снять отметки за месяц</button><button class="del'+(armed==='g'?' armed':'')+'" data-act="delg">'+(armed==='g'?'Точно удалить?':'Удалить группу')+'</button></div>';
  }
  document.getElementById('app').innerHTML=h;
  if(focusId){var e=document.getElementById(focusId);if(e)e.focus()}
}
document.getElementById('app').addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act,id=t.dataset.id,g=cur&&grp(cur);
  if(a!=='delg'&&a!=='delp')armed=null;
  if(a==='mprev'){month=shift(month,-1);render();return}
  if(a==='mnext'){month=shift(month,1);render();return}
  if(a==='open'){cur=id;render()}
  else if(a==='home'){cur=null;render()}
  else if(a==='addg'){var v=document.getElementById('ng').value.trim();if(!v)return;data.groups.push({id:uid(),name:v,price:0,people:[]});save();render('ng')}
  else if(a==='addp'){var v2=document.getElementById('np').value.trim();if(!v2)return;g.people.push({id:uid(),name:v2,months:{}});save();render('np')}
  else if(a==='tog'){var p=g.people.find(function(x){return x.id===id});if(!p.months)p.months={};if(p.months[month])delete p.months[month];else p.months[month]=true;save();render()}
  else if(a==='delp'){ev.stopPropagation();if(armed===id){g.people=g.people.filter(function(x){return x.id!==id});armed=null;save()}else{armed=id;setTimeout(function(){if(armed===id){armed=null;render()}},2500)}
    render();if(armed===id){var el=document.querySelector('[data-act="delp"][data-id="'+id+'"]');if(el){el.textContent='?';el.style.color='var(--danger)'}}}
  else if(a==='reset'){g.people.forEach(function(x){if(x.months)delete x.months[month]});save();render()}
  else if(a==='delg'){if(armed==='g'){data.groups=data.groups.filter(function(x){return x.id!==cur});cur=null;armed=null;save();render()}else{armed='g';render();setTimeout(function(){if(armed==='g'){armed=null;render()}},2500)}}
});
document.getElementById('app').addEventListener('change',function(ev){
  if(ev.target.id==='pr'){var g=grp(cur);g.price=parseFloat(ev.target.value)||0;save();render()}
});
document.getElementById('app').addEventListener('keydown',function(ev){
  if(ev.key!=='Enter')return;
  if(ev.target.id==='ng')document.querySelector('[data-act="addg"]').click();
  if(ev.target.id==='np')document.querySelector('[data-act="addp"]').click();
});
render();
</script>
</body>
</html>
